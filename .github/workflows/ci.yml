name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Spec conformance
        run: uv run python scripts/check_specs.py

      - name: Cross-tenant leakage test
        run: |
          code=0
          uv run pytest -k leakage -q || code=$?
          if [ "$code" -eq 5 ]; then echo "no leakage tests yet — skipping"; exit 0; fi
          exit "$code"