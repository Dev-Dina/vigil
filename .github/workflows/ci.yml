name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vigil
          POSTGRES_PASSWORD: vigil
          POSTGRES_DB: vigil
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U vigil"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Secrets via the local-dev env shim (Vault is the prod source; not run in CI).
      VIGIL_SECRETS_BACKEND: env
      VIGIL_JWT_SIGNING_KEY: ci-signing-key-not-a-secret-32bytes!
      VIGIL_LLM_API_KEY: ci-llm-key
      # Admin (superuser) DSN runs migrations; the app connects as the least-privilege
      # vigil_app role created by the test harness so RLS actually binds.
      VIGIL_DB_ADMIN_DSN: postgresql+psycopg://vigil:vigil@localhost:55432/vigil
      VIGIL_REDIS_URL: redis://localhost:6379/15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Spec conformance
        run: uv run python scripts/check_specs.py

      - name: Fast suite (Phase-1 ingestion + units, no slow markers)
        run: uv run pytest -m "not slow"

      - name: Cross-tenant leakage test (the sacred test)
        run: uv run pytest tests/spine/test_leakage.py -q

      - name: Spine suite (auth, RLS, worker, API)
        run: uv run pytest tests/spine -q

      # The live model-isolation invariants (B2b 7/8/9 score_trial end-to-end, B2c
      # champion/shadow) are `slow`-marked (torch) and excluded by the default
      # `-m "not slow"` addopts. They are sacred isolation tests, not optional: run the
      # FULL spine suite — slow included — against the Postgres service. Committed model
      # artifacts make this ~10s; the heavy 18k-cohort regeneration slow tests live
      # outside tests/spine and are NOT pulled in here.
      - name: Sacred live invariants (spine, slow included — Postgres-backed)
        run: uv run pytest tests/spine -m "slow or not slow" -q

      # Frontend typecheck: `next build` historically had ignoreBuildErrors (now removed) and
      # `next lint` was dropped in Next 16, so frontend type errors went uncaught. tsc --noEmit
      # is the real gate. (eslint is deferred: the project has no eslint config/install yet —
      # a fresh flat config is out of scope for this gate; tracked in ROADMAP.)
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend typecheck (tsc --noEmit)
        run: npx tsc --noEmit
        working-directory: frontend
