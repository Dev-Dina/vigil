[project]
name = "vigil"
version = "0.0.0"
description = "Clinical-trial retention intelligence platform"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.5.0",
    "scipy>=1.17.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "arq>=0.26.0",
    "hvac>=2.3.0",
    "pyjwt[crypto]>=2.10.0",
    "argon2-cffi>=23.1.0",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.12",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "torch>=2.12.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "matplotlib>=3.8",
    "marimo>=0.23.9",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m \"not slow\""
asyncio_mode = "auto"
markers = [
    "slow: full 18k-cohort synthetic regeneration; excluded by default and from CI (run via `make test-slow`)",
]
