[project]
name = "vigil"
version = "0.0.0"
description = "Clinical-trial retention intelligence platform"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.5.0",
    "scipy>=1.17.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "arq>=0.26.0",
    "hvac>=2.3.0",
    "pyjwt[crypto]>=2.10.0",
    "argon2-cffi>=23.1.0",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.12",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "torch>=2.12.0",
    "lifelines>=0.30.0",
    "httpx>=0.27.0",
    "pgvector>=0.4.2",
    "sentence-transformers>=5.5.1",
    "anthropic>=0.109.2",
    "langfuse>=2.0.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "matplotlib>=3.8",
    "marimo>=0.23.9",
]

[tool.uv]
package = false

# CPU-only PyTorch (Gate D1): there is no GPU on the dev host, the CI runners, or the Docker image,
# so the default Linux PyPI torch (a multi-GB CUDA wheel + nvidia-* stack) is the wrong artifact.
# Only Linux is affected — Windows + macOS PyPI torch are already CPU-only — so we redirect ONLY
# the Linux resolution to the PyTorch CPU index (the ~200MB +cpu wheel, no nvidia-* deps). CPU
# torch runs LSTM inference + training + sentence-transformers fully (only GPU acceleration is
# absent). The index is `explicit` so it is used solely for the package(s) that reference it.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m \"not slow\""
asyncio_mode = "auto"
markers = [
    "slow: torch/LSTM spine tests + the heavy 18k-cohort synthetic regeneration. Excluded from the default fast run (the `-m \"not slow\"` addopts). CI DOES run the slow-inclusive spine (`pytest tests/spine -m \"slow or not slow\"`, Postgres-backed); only the heavy regeneration slow tests outside tests/spine are excluded from CI — run those via `make test-slow`.",
]
