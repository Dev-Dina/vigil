# Local-dev datastores for the backend spine (infra.md app side) + the isolated Guide.
# Secrets come from Vault dev (or the env shim); never from this file.
# The Guide shares NO datastore with the app side: it sits on its OWN network (guide-net) with no
# route to postgres/redis/vault (those are on the compose default network). This is the dev-layer
# of the isolation boundary; the full NetworkPolicy denial + positive control is the Phase-8
# kind/minikube integration job (specs/isolation.md §3, infra.md).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil
      POSTGRES_DB: vigil
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vault — PERSISTENT file storage (NOT dev-mode/inmem), so secrets survive restarts. Starts
  # UNINITIALISED + SEALED: `operator init` once, then `operator unseal` on each start (dev
  # runbook in README.md). No fixed root token — it comes from `operator init`. The app reads
  # secrets via the KV v2 engine (vigil/core/secrets.py). For a quick env-only run you may still
  # use the shim (VIGIL_SECRETS_BACKEND=env). Config in infra/vault/vault.hcl (no secrets there).
  vault:
    image: hashicorp/vault:1.17
    # Run as the NON-ROOT vault user (uid 100, gid 1000 in the image). We bypass the image's
    # docker-entrypoint.sh (entrypoint: ["vault"]) and invoke vault directly with our single
    # file config — that wrapper, on the `server` branch, injects `-config=/vault/config` +
    # `-dev-listen-address=0.0.0.0:8200`, which double-binds 8200 (crash). Bypassing it gives a
    # single 8200 listener; `user:` runs the process non-root. disable_mlock=true → no setcap.
    # The vault-data volume must be owned by 100:1000 (see README "volume permissions").
    entrypoint: ["vault"]
    command: ["server", "-config=/vault/config/vault.hcl"]
    user: "100:1000"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    volumes:
      - ./infra/vault/vault.hcl:/vault/config/vault.hcl:ro
      - vault-data:/vault/file # encrypted persistent storage (Docker-managed; not in the repo)

  # Public Guide (isolated). On its OWN network only (guide-net) — NO route to postgres/redis/
  # vault, which live on the compose default network. Builds the guide/ package alone (no vigil/).
  # Its secret set is just its own LLM key (unused in 7.1); no DB DSN, no Vault token, no Redis.
  guide:
    build:
      context: .
      dockerfile: guide/Dockerfile
    ports:
      - "8080:8080"
    networks:
      - guide-net
    environment:
      VIGIL_GUIDE_LOG_LEVEL: INFO

volumes:
  vault-data:

networks:
  # Dedicated network for the Guide so it cannot resolve/reach the app datastores (which use the
  # implicit default network). The hard, asserted denial is the Phase-8 NetworkPolicy job.
  guide-net:
    driver: bridge
