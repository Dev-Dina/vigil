# Local-dev datastores for the backend spine (infra.md app side) + the isolated Guide.
# Secrets come from Vault dev (or the env shim); never from this file.
# The Guide shares NO datastore with the app side: it sits on its OWN network (guide-net) with no
# route to postgres/redis/vault (those are on the compose default network). This is the dev-layer
# of the isolation boundary; the full NetworkPolicy denial + positive control is the Phase-8
# kind/minikube integration job (specs/isolation.md §3, infra.md).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil
      POSTGRES_DB: vigil
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vault — PERSISTENT file storage (NOT dev-mode/inmem), so secrets survive restarts. Starts
  # UNINITIALISED + SEALED: `operator init` once, then `operator unseal` on each start (dev
  # runbook in README.md). No fixed root token — it comes from `operator init`. The app reads
  # secrets via the KV v2 engine (vigil/core/secrets.py). For a quick env-only run you may still
  # use the shim (VIGIL_SECRETS_BACKEND=env). Config in infra/vault/vault.hcl (no secrets there).
  vault:
    image: hashicorp/vault:1.17
    # PROD-SHAPED Vault: persistent file storage + manual Shamir unseal. Gated behind the
    # `prod-vault` profile (Gate D1) so the dev app stack uses the auto-unsealed `vault-dev`
    # instead; start this one explicitly with `--profile prod-vault` when exercising the prod
    # unseal lifecycle (operator init/unseal — see docs/RUNBOOK.md / README.md).
    profiles: ["prod-vault"]
    # Run as the NON-ROOT vault user (uid 100, gid 1000 in the image). We bypass the image's
    # docker-entrypoint.sh (entrypoint: ["vault"]) and invoke vault directly with our single
    # file config — that wrapper, on the `server` branch, injects `-config=/vault/config` +
    # `-dev-listen-address=0.0.0.0:8200`, which double-binds 8200 (crash). Bypassing it gives a
    # single 8200 listener; `user:` runs the process non-root. disable_mlock=true → no setcap.
    # The vault-data volume must be owned by 100:1000 (see README "volume permissions").
    entrypoint: ["vault"]
    command: ["server", "-config=/vault/config/vault.hcl"]
    user: "100:1000"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    volumes:
      - ./infra/vault/vault.hcl:/vault/config/vault.hcl:ro
      - vault-data:/vault/file # encrypted persistent storage (Docker-managed; not in the repo)

  # Public Guide (isolated). On its OWN network only (guide-net) — NO route to postgres/redis/
  # vault/api/worker, which live on the compose default network. Builds the guide/ package alone
  # (no vigil/). Its secret set is just its OWN LLM key; no DB DSN, no Vault token, no Redis. STUBBED
  # by default (no key, no live call); the key-safe live path is docker-compose.live.yml (Gate D3).
  guide:
    # Gated behind the `guide` profile (Gate D1) so it does not start with the dev app stack;
    # the Guide is its own (D3) gate. Start with `--profile guide`.
    profiles: ["guide"]
    build:
      context: .
      dockerfile: guide/Dockerfile
    image: vigil-guide:local
    ports:
      - "8080:8080"
    networks:
      - guide-net
    environment:
      VIGIL_GUIDE_LOG_LEVEL: INFO
      # CORS allow-list for the browser-DIRECT frontend calls (lib/guide.ts → /ask, /metrics/cost).
      # The frontend is host-published at :3000; prod overrides with its real origin. No credentials.
      VIGIL_GUIDE_CORS_ORIGINS: ${VIGIL_GUIDE_CORS_ORIGINS:-http://localhost:3000}
      # Hermetic by DEFAULT: the deterministic stub LLM — no key, no live call (CI-safe parity with
      # the app's VIGIL_LLM_STUB). The live path flips this off + supplies the Guide's OWN key.
      VIGIL_GUIDE_LLM_STUB: "true"
    volumes:
      # The Guide's OWN offline embedder weights (vendored all-MiniLM-L6-v2), bind-mounted READ-ONLY.
      # Host files, NOT an app service — gives the Guide its embedder with NO route to the app's
      # Postgres/Vault/services. Isolation (guide-net) is unchanged; the weights are public, not PII.
      - ./data/models/embeddings/all-MiniLM-L6-v2:/app/data/models/embeddings/all-MiniLM-L6-v2:ro
    # Build the Guide-owned approved-doc index from the mounted weights, THEN serve. The index is
    # written INSIDE the container (a Guide-owned artifact), never shared with the app.
    command: ["sh", "-c", "python -m guide.build_index && exec uvicorn guide.app:app --host 0.0.0.0 --port 8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

# --- Dockerized app stack (Gate D1) — DEV-ONLY, profile "app" --------------------------------
# `docker compose -f docker-compose.dev.yml --profile app up -d --build` brings up:
#   postgres + redis (un-profiled, always) + vault-dev + vault-seed + api + worker.
# The API + worker share ONE image (./Dockerfile). They READ SECRETS FROM VAULT (vault-dev) and
# connect to Postgres BY SERVICE NAME as the non-superuser vigil_app under RLS — the security model
# is unchanged; only the secret SOURCE (a dev Vault) and the host (service name) differ.

  # Dev-mode Vault: auto-unsealed, in-memory, FIXED root token. DEV-ONLY. The PROD model is the
  # persistent Shamir-sealed `vault` service (profile prod-vault) + infra/vault/vault.hcl.
  vault-dev:
    image: hashicorp/vault:1.17
    profiles: ["app"]
    cap_add: ["IPC_LOCK"]
    entrypoint: ["vault"]
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200", "-dev-root-token-id=vigil-dev-root"]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Seed the dev Vault with the app secrets — crucially the IN-CONTAINER DB DSN (postgres:5432,
  # NOT the host localhost:55432) so the localhost->service-name + 55432->5432 difference is
  # resolved in the secret value itself. One-off; exits 0.
  vault-seed:
    image: hashicorp/vault:1.17
    profiles: ["app"]
    depends_on:
      vault-dev:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault-dev:8200
      VAULT_TOKEN: vigil-dev-root
    entrypoint: ["sh", "-c"]
    command:
      - |
        vault kv put secret/vigil/db/dsn value="postgresql+psycopg://vigil_app:vigil_app_pw@postgres:5432/vigil" &&
        vault kv put secret/vigil/auth/jwt_signing_key value="dev-jwt-signing-key-not-for-production-0123456789abcdef" &&
        vault kv put secret/vigil/llm/api_key value="dev-llm-key-placeholder" &&
        echo "vault-dev seeded: db/dsn(in-container), jwt_signing_key, llm/api_key"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vigil-app:dev
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-seed:
        condition: service_completed_successfully
    environment:
      VIGIL_SECRETS_BACKEND: vault
      VAULT_ADDR: http://vault-dev:8200
      VAULT_TOKEN: vigil-dev-root
      VIGIL_REDIS_URL: redis://redis:6379/0
      VIGIL_LLM_STUB: "true"
      VIGIL_CORS_ALLOW_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: vigil-app:dev
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-seed:
        condition: service_completed_successfully
    environment:
      VIGIL_SECRETS_BACKEND: vault
      VAULT_ADDR: http://vault-dev:8200
      VAULT_TOKEN: vigil-dev-root
      VIGIL_REDIS_URL: redis://redis:6379/0
      VIGIL_LLM_STUB: "true"
    command: ["arq", "vigil.workers.settings.WorkerSettings"]
    volumes:
      - ./data:/app/data:ro

  # One-off DDL/seed (profile "tools"; run via `docker compose ... run --rm`). They need only
  # Postgres. Migrations run as the OWNER (vigil) via VIGIL_DB_ADMIN_DSN; the seed runs as the
  # non-superuser vigil_app (env-backend DSN) — the same role split as the host flow.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: vigil-app:dev
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VIGIL_DB_ADMIN_DSN: postgresql+psycopg://vigil:vigil@postgres:5432/vigil
    command: ["python", "-m", "alembic", "upgrade", "head"]

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    image: vigil-app:dev
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VIGIL_SECRETS_BACKEND: env
      VIGIL_DB_DSN: postgresql+psycopg://vigil_app:vigil_app_pw@postgres:5432/vigil
      VIGIL_JWT_SIGNING_KEY: dev-jwt-signing-key-not-for-production-0123456789abcdef
      VIGIL_REDIS_URL: redis://redis:6379/0
      VIGIL_LLM_STUB: "true"
    volumes:
      - ./data:/app/data:ro
    command: ["python", "-m", "vigil.seed"]

  # Mailpit (Gate OBS-MAIL) — a self-contained, demo-safe catch-all SMTP server with a web inbox.
  # On the compose DEFAULT network so api/worker reach it at `mailpit:1025`; the web UI is published
  # at :8025. It accepts ANY mail and delivers NOTHING externally (no accounts, no spam). Gated under
  # the `mail` profile so the default stack does not start it. Pairs with docker-compose.mail.yml,
  # which flips api/worker to a REAL SMTP send (VIGIL_EMAIL_STUB=false) pointed here. NOT on guide-net
  # (the Guide sends no email).
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    ports:
      - "1025:1025"  # SMTP (also reachable in-network as mailpit:1025; published for host senders)
      - "8025:8025"  # web inbox — http://localhost:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"      # accept any/no credentials (demo catch-all)
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"  # allow plaintext (no STARTTLS) — matches the mail override
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/livez"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # --- Next.js frontend (Gate D2) — PRODUCTION build, profile "frontend" ------------------------
  # Completes the one-command whole-system bring-up:
  #   docker compose -f docker-compose.dev.yml --profile app --profile guide --profile frontend up -d --build
  # The frontend is JUST an HTTP server serving the built UI on :3000. The BROWSER (on the host) calls
  # the app API (:8000) and the isolated Guide (:8080) at their HOST-published ports — so the
  # NEXT_PUBLIC_* are BUILD-time host URLs, and this container needs NO app network and NO depends_on
  # (it never reaches app services itself). Out of the default stack — only under --profile frontend.
  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Host-published ports (the browser calls these), overridable from the shell. NOT service names.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_GUIDE_URL: ${NEXT_PUBLIC_GUIDE_URL:-http://localhost:8080}
    image: vigil-frontend:local
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  vault-data:

networks:
  # Dedicated network for the Guide so it cannot resolve/reach the app datastores (which use the
  # implicit default network). The hard, asserted denial is the Phase-8 NetworkPolicy job.
  guide-net:
    driver: bridge
