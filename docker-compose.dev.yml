# Local-dev datastores for the backend spine (infra.md app side).
# Secrets come from Vault dev (or the env shim); never from this file.
# The Guide surface is intentionally NOT here — it shares no datastore with the app side.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil
      POSTGRES_DB: vigil
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vault — PERSISTENT file storage (NOT dev-mode/inmem), so secrets survive restarts. Starts
  # UNINITIALISED + SEALED: `operator init` once, then `operator unseal` on each start (dev
  # runbook in README.md). No fixed root token — it comes from `operator init`. The app reads
  # secrets via the KV v2 engine (vigil/core/secrets.py). For a quick env-only run you may still
  # use the shim (VIGIL_SECRETS_BACKEND=env). Config in infra/vault/vault.hcl (no secrets there).
  vault:
    image: hashicorp/vault:1.17
    command: server -config=/vault/config/vault.hcl
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    volumes:
      - ./infra/vault/vault.hcl:/vault/config/vault.hcl:ro
      - vault-data:/vault/file # encrypted persistent storage (Docker-managed; not in the repo)

volumes:
  vault-data:
